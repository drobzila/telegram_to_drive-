name: Upload Telegram Videos to Drive

on:
  schedule:
    - cron: "0 12 * * *"  # كل يوم الساعة 12:00 UTC
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create telegram.session
      run: |
        echo "$TELEGRAM_SESSION" | base64 -d > telegram.session
      env:
        TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

    - name: Create mycreds.txt
      run: |
        echo "$GDRIVE_CREDS" | base64 -d > mycreds.txt
      env:
        GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}

    - name: Run script
      run: python telegram_to_drive.py
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        GOOGLE_FOLDER: ${{ secrets.GOOGLE_FOLDER }}
