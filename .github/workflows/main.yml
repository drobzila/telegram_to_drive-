name: Telegram to Google Drive

on:
  schedule:
    - cron: '0 12 * * *'  # تشغيل يوميًا الساعة 12:00 UTC
  workflow_dispatch:     # لتشغيله يدويًا أيضًا

jobs:
  upload-videos:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install telethon moviepy PyDrive

    - name: Setup environment variables
      run: echo "Environment variables are set"
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        GOOGLE_FOLDER: ${{ secrets.GOOGLE_FOLDER }}
    
    - name: Add Telegram session
      run: |
        echo "${{ secrets.TELEGRAM_SESSION }}" | base64 -d > telegram.session

    - name: Run Telegram to Drive script
      run: python telegram_to_drive.py
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        GOOGLE_FOLDER: ${{ secrets.GOOGLE_FOLDER }}
